version: 2

source:
  repository: TavallStudios/function-catalog
  provider: github

build:
  type: gradle
  java: 25
  gradle: 9.6.1

resources:
  mode: SYSTEM

artifacts:
  - name: function-catalog-mcp-server
    path: mcp-server/build/distributions/mcp-server-*.zip
  - name: tavall-cloud-contracts
    path: tavall-cloud-contracts/build/libs/tavall-cloud-contracts-*.jar

requiredChecks:
  - quality

checks:
  quality:
    executor: gradle
    tasks:
      - "clean"
      - ":gemini-sdk:clean"
      - ":ai-core:clean"
      - ":agent-runtime:clean"
      - ":codex-agent-provider:clean"
      - ":openai-sdk:clean"
      - ":claude-sdk:clean"
      - ":mcp-server:clean"
      - ":strands-agent-provider:clean"
      - ":tavall-cloud-contracts:clean"
      - "check"
      - ":gemini-sdk:check"
      - ":ai-core:check"
      - ":agent-runtime:check"
      - ":codex-agent-provider:check"
      - ":openai-sdk:check"
      - ":claude-sdk:check"
      - ":mcp-server:check"
      - ":strands-agent-provider:check"
      - ":tavall-cloud-contracts:check"
      - "assemble"
      - ":gemini-sdk:assemble"
      - ":ai-core:assemble"
      - ":agent-runtime:assemble"
      - ":codex-agent-provider:assemble"
      - ":openai-sdk:assemble"
      - ":claude-sdk:assemble"
      - ":mcp-server:assemble"
      - ":strands-agent-provider:assemble"
      - ":tavall-cloud-contracts:assemble"
      - ":mcp-server:distZip"

  integration:
    executor: gradle
    tasks:
      - ":mcp-server:integrationTest"
    includeInAll: false

  artifact:
    executor: shell
    script: .tavallci/scripts/publish-public-packages.sh
    includeInAll: false
