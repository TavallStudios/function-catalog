name: Gradle

on:
  pull_request:
  push:
    branches:
      - main
      - "working/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Generate migration dependency locks
        run: ./gradlew --no-daemon dependencies --write-locks

      - name: Validate Function Catalog
        run: ./gradlew --no-daemon clean check publishToMavenLocal stageRuntime

      - name: Upload generated lock state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-gradle-locks
          path: "**/gradle.lockfile"
          if-no-files-found: error
