name: Publish locked Function Catalog artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version required by downstream dependency locks
        required: true
        default: "1.0.1"
        type: string
  push:
    branches:
      - main
    paths:
      - gradle/release-version.txt

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve locked release version
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version='${{ inputs.version }}'
          else
            version="$(tr -d '[:space:]' < gradle/release-version.txt)"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Packages
        run: ./gradlew --no-daemon --max-workers=1 -PtavallVersion="${{ steps.release.outputs.version }}" clean check publish
